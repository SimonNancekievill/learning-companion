{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md space-y-6">
    <h1 class="text-2xl font-bold tracking-tight">Log in</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="rounded bg-slate-900 px-4 py-2 font-semibold text-white">
        Log in
      </button>
    </form>
    <p class="text-sm text-slate-600">
      No account yet? <a href="{% url 'accounts:signup' %}" class="font-semibold underline">Sign up</a>
    </p>
  </section>
{% endblock %}
