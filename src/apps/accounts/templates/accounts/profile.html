{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md space-y-6">
    <h1 class="text-2xl font-bold tracking-tight">Profile</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="rounded bg-slate-900 px-4 py-2 font-semibold text-white">
        Save profile
      </button>
    </form>
  </section>
{% endblock %}
