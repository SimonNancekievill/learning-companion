{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md space-y-6">
    <h1 class="text-2xl font-bold tracking-tight">Sign up</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form }}
      <button type="submit" class="rounded bg-slate-900 px-4 py-2 font-semibold text-white">
        Create account
      </button>
    </form>
    <p class="text-sm text-slate-600">
      Already have an account? <a href="{% url 'accounts:login' %}" class="font-semibold underline">Log in</a>
    </p>
  </section>
{% endblock %}
